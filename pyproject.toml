[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domaintune"
version = "0.1.0"
description = "Reproducible banking intent classification experiments with PEFT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
ml = [
  "torch>=2.6,<3", "transformers>=4.49,<5", "datasets>=3,<5",
  "peft>=0.14,<1", "trl>=0.15,<1", "accelerate>=1,<2", "mlflow>=2.20,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/domaintune", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
